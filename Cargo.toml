[package]
name = "hostwatch"
version = "0.2.1"
edition = "2021"
rust-version = "1.79"
description = "Low-overhead, read-only host diagnostics; macOS first"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# Native menu-bar shell (NSStatusItem); no WebView. objc2 0.6 / app-kit 0.3 build on Rust 1.79.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSTimer", "NSDate", "NSRunLoop", "NSURL", "NSArray", "NSDictionary", "NSGeometry", "NSNotification", "NSValue", "NSAttributedString", "NSEnumerator", "NSProcessInfo", "NSError", "NSLocale", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSButtonCell", "NSActionCell", "NSControl", "NSView", "NSCell", "NSMenu", "NSMenuItem", "NSWorkspace", "NSPopover", "NSViewController", "NSTextField", "NSText", "NSFont", "NSFontDescriptor", "NSColor", "NSImage", "NSImageView", "NSImageCell", "NSBezierPath", "NSGraphics", "NSScrollView", "NSClipView", "NSScreen", "NSWindow", "NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityProtocols", "NSAttributedString", "NSStringDrawing", "NSParagraphStyle", "NSUserInterfaceLayout", "NSLayoutConstraint", "NSAppearance", "libc", "objc2-core-foundation"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

